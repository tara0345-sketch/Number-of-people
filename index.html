<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구역별 스프레드시트 이동</title>
    <style>
        /* 기본 페이지 여백 및 폰트 설정 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 우측 상단 앱 다운로드 섹션 */
        .download-section {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            font-weight: bold;
            font-size: 18px;
        }

        .download-section img {
            height: 45px;
            cursor: pointer;
        }

        /* 메인 제목 */
        h2 {
            margin-bottom: 40px;
            font-size: 28px;
        }

        /* 2열 그리드 레이아웃 설정 */
        #links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 80px; /* 위아래 간격 20px, 좌우 간격 80px */
            max-width: 600px;
            width: 100%;
        }

        .link-container {
            display: flex;
            justify-content: center;
        }

        /* 파란색 버튼 디자인 */
        .button {
            display: inline-block;
            width: 180px;
            padding: 12px 0;
            background-color: #0d6efd; /* 스크린샷과 유사한 파란색 */
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s ease-in-out;
        }

        .button:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="download-section">
        <span>앱 다운로드</span>
        <a href="#" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
        </a>
        <a href="#" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
        </a>
    </div>

    <h2>구역별 스프레드시트 이동</h2>

    <div id="links"></div>

    <script>
        // 복구된 자바스크립트 로직
        const sheetUrl = "https://docs.google.com/spreadsheets/d/1yD3sPYsU3U-aBpLrQ62IFQK5WCb1Ut1ACNTnQEnQZOE/edit#gid=0";
        const areas = ["11구역", "12구역", "13구역", "14구역", "21구역", "22구역", "23구역", "24구역",
                        "31구역", "32구역", "33구역", "34구역", "41구역", "42구역", "43구역", "44구역",
                        "51구역", "52구역", "53구역", "54구역"];

        const linksDiv = document.getElementById("links");
        
        areas.forEach(area => {
            const div = document.createElement("div");
            div.classList.add("link-container");
            div.innerHTML = `<a class="button" href="${sheetUrl.replace("gid=0", `gid=${getGid(area)}`)}" target="_blank">${area} 이동</a>`;
            linksDiv.appendChild(div);
        });

        function getGid(area) {
            const gids = {
                "11구역": 396997134, "12구역": 1593202344, "13구역": 1984506026, "14구역": 1327914051,
                "21구역": 1926118862, "22구역": 2071693966, "23구역": 329402956, "24구역": 112435682,
                "31구역": 481331874, "32구역": 1553524851, "33구역": 1518880820, "34구역": 1934959593,
                "41구역": 521452141, "42구역": 1656018205, "43구역": 293280473, "44구역": 1556860253,
                "51구역": 786508486, "52구역": 1920099514, "53구역": 869821696, "54구역": 703456572
            };
            return gids[area] || 0;
        }
    </script>

</body>
</html>
